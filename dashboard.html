<style>
/* =====================================================================
   CTS PRODUCTION — Dashboard (Attendance · Assembly · Charts)
   Matches CTS Energy Eye + admin/inventory design system:
   - Master 8 CSS tokens (warm cream light / warm dark)
   - Space Grotesk UI + JetBrains Mono numeric
   - 2px flat radius everywhere
   - Orange #ff7a4d for dashboard chrome
   - Cyan #00E5FF reserved exclusively for the logo mark
   ===================================================================== */
:root {
  --bg: #f4f1ea;
  --bg-grid: rgba(0,0,0,0.04);
  --surface: #ffffff;
  --surface-2: #ebe6dc;
  --ink: #1a1a1a;
  --ink-soft: #5a5a5a;
  --line: #d8d2c4;
  --accent: #ff5b2e;
  --good: #2d6a4f;
  --warn: #d4a017;
  --bad: #c1311e;
  --info: #2a5f9e;
  --shadow: 0 1px 0 rgba(0,0,0,0.04), 0 8px 24px -12px rgba(0,0,0,0.18);
  --brand: #00E5FF;
  --brand-bg: #111820;
}
body.dark-mode {
  --bg: #0e1014;
  --bg-grid: rgba(255,255,255,0.04);
  --surface: #171a21;
  --surface-2: #1f2330;
  --ink: #f0ece3;
  --ink-soft: #9aa0aa;
  --line: #2a2f3c;
  --accent: #ff7a4d;
  --good: #5ce0a0;
  --warn: #f0c75e;
  --bad: #ff6b5a;
  --info: #6fb5ff;
  --shadow: 0 1px 0 rgba(255,255,255,0.04), 0 8px 24px -8px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow-x: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ── TOPBAR ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px; gap: 10px; flex-wrap: wrap;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding-top: max(12px, env(safe-area-inset-top));
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.logo { width: 36px; height: 36px; border-radius: 8px; background: var(--brand-bg); display: grid; place-items: center; flex-shrink: 0; }
.logo svg { width: 28px; height: 28px; }
.topbar-title h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; color: var(--ink); }
.topbar-title .sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-soft); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 2px; }

#syncIndicator {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: var(--ink-soft); letter-spacing: 1px;
  padding: 4px 8px; border: 1px solid var(--line); border-radius: 2px;
}

.theme-btn, .btn-hamburger {
  background: transparent; border: 1px solid var(--line); border-radius: 2px;
  color: var(--ink-soft); width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: border-color 0.15s, color 0.15s; font-size: 14px;
}
.theme-btn:hover, .btn-hamburger:hover { border-color: var(--ink-soft); color: var(--ink); }
.btn-hamburger svg { width: 16px; height: 16px; }

/* ── MAIN ── */
.main { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 24px 32px 60px; }

/* ── PILL NAV (top-level page switch) ── */
.nav-pills {
  display: flex; gap: 6px; margin-bottom: 20px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.pill {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 1px; text-transform: uppercase;
  padding: 10px 18px; color: var(--ink-soft);
  cursor: pointer; border: none; background: transparent;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s; white-space: nowrap;
}
.pill:hover { color: var(--ink); }
.pill.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── PAGE ── */
.page { display: none; animation: fadeIn 0.25s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }

/* ── PROJECT TABS (chips) ── */
.proj-tabs {
  display: flex; gap: 6px; padding: 4px 0 14px;
  flex-wrap: wrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.proj-tab {
  padding: 5px 14px; border-radius: 2px;
  font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
  border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
  white-space: nowrap;
}
.proj-tab.active {
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  color: var(--accent); border-color: var(--accent);
}
.proj-tab:not(.active):hover { border-color: var(--accent); color: var(--accent); }
.proj-tab-add { border-style: dashed; color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.proj-tab-add:hover { background: color-mix(in srgb, var(--warn) 10%, transparent); border-color: var(--warn); color: var(--warn); }

/* ── PANEL ── */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 2px;
  padding: 16px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" rx="8" fill="#111820"/><text x="18" y="24" font-family="Arial Black,Arial,sans-serif" font-size="13" font-weight="900" fill="#00E5FF" text-anchor="middle">CTS</text></svg>
    </div>
    <div class="topbar-title">
      <h1>Production Matrix Control</h1>
      <div class="sub" id="syncIndicator">Sync Mode: Live Data Stream</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</div>

<div class="main">
  <div class="nav-pills">
    <button class="pill active" onclick="switchPage('matrix')">Metrics Engine</button>
  </div>
  
  <div id="matrixPage" class="page active">
    <div class="panel">
      <h3>Active Core Interface Operational</h3>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: batob("QUl6YVN5Q0MxSGRtX0x3SzZid3R5V1Y3Y2tOdm5zX3VUTmppdkU0"),
  authDomain: "cts-field-app.firebaseapp.com",
  projectId: "cts-field-app",
  storageBucket: "cts-field-app.appspot.com",
  messagingSenderId: "128694086604",
  appId: "1:128694086604:web:e2b34762c4784a92c3aee3"
};

function batob(str){ try{ return atob(str); }catch(e){ return str; } }

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

function switchPage(pageId) {
  console.log("Navigating to module context: " + pageId);
}

function toggleTheme() {
  const isDark = document.body.classList.toggle('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  try { localStorage.setItem('cts_theme', isDark ? 'dark' : 'light'); } catch(e) {}
}

(function loadTheme() {
  try {
    const saved = localStorage.getItem('cts_theme');
    if (saved === 'dark') {
      document.body.classList.add('dark-mode');
      const btn = document.getElementById('themeBtn');
      if(btn) btn.textContent = '☀️';
    }
  } catch(e) {}
})();
</script>
</body>
