<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CTS Production">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgMzYgMzYiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgd2lkdGg9IjM2IiBoZWlnaHQ9IjM2Ij48cmVjdCB3aWR0aD0iMzYiIGhlaWdodD0iMzYiIHJ4PSI4IiBmaWxsPSIjMTExODIwIi8+PHRleHQgeD0iMTgiIHk9Ij20IiBmb250LWZhbWlseT0iQXJpYWwgQmxhY2ssQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxMyIgZm9udC13ZWlnaHQ9IjEwMCIgZmlsbD0iIzAwRTVGRiIgdGV4dC1hbmochem9yPSJtaWRkbGUiPkNUUzwvdGV4dD48L3N2Zz4=">
<title>CTS Production · Inventory Ledger</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.6.0/jspdf.plugin.autotable.min.js"></script>

<style>
:root {
  --bg:#0e1014; --sf:#15181f; --sf2:#1e222b;
  --br:rgba(255,255,255,0.08); --tx:#f3f4f6; --t2:#9ca3af;
  --cy:#00E5FF; --cyb:rgba(0,229,255,0.15);
  --rd:#ef4444; --gn:#10b981;
}
body.light-mode {
  --bg:#f9fafb; --sf:#ffffff; --sf2:#f3f4f6;
  --br:rgba(0,0,0,0.08); --tx:#111827; --t2:#6b7280;
  --cy:#0d9488; --cyb:rgba(13,148,136,0.15);
  --rd:#dc2626; --gn:#059669;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg); color: var(--tx); padding: 16px; min-height: 100vh; padding-bottom: 80px; transition: background 0.2s, color 0.2s; }

.header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; background: var(--sf); padding: 16px; border-radius: 12px; border: 1px solid var(--br); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.brand svg { width: 32px; height: 32px; }
.brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }

.btn-row { display: flex; gap: 8px; }
.btn { background: var(--sf2); color: var(--tx); border: 1px solid var(--br); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s ease; text-decoration: none; }
.btn:hover { background: var(--br); border-color: var(--t2); }
.btn-primary { background: var(--cy); color: #000; border: none; }
body.light-mode .btn-primary { color: #fff; }
.btn-primary:hover { opacity: 0.9; }

.card { background: var(--sf); border-radius: 12px; border: 1px solid var(--br); padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--t2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-box { background: var(--sf2); border-radius: 8px; border: 1px solid var(--br); padding: 14px; text-align: center; }
.stat-val { font-size: 22px; font-weight: 700; color: var(--cy); margin-bottom: 4px; }
.stat-lbl { font-size: 11px; color: var(--t2); font-weight: 500; }

.table-wrapper { width: 100%; overflow-x: auto; background: var(--sf); border-radius: 8px; border: 1px solid var(--br); }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
th { background: var(--sf2); padding: 12px; font-weight: 600; color: var(--t2); border-bottom: 1px solid var(--br); }
td { padding: 12px; border-bottom: 1px solid var(--br); color: var(--tx); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.01); }

.badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
.badge-inbound { background: rgba(16,185,129,0.15); color: var(--gn); }
.badge-outbound { background: rgba(239,68,68,0.15); color: var(--rd); }

#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); z-index: 9999; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 8px; }
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.err { background: var(--rd); }
#toast.ok { background: var(--gn); }

.loading-shield { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 12px; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--sf2); border-top-color: var(--cy); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loading-shield" id="loader">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--t2);font-weight:500;">Loading Ledger Framework...</div>
</div>

<div class="header-bar">
  <a href="dashboard.html" class="brand">
    <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" rx="8" fill="#111820"/><text x="18" y="24" font-family="Arial Black,Arial,sans-serif" font-size="13" font-weight="100" fill="#00E5FF" text-anchor="middle">CTS</text></svg>
    <h1>Inventory Management Ledger</h1>
  </a>
  <div class="btn-row">
    <button class="btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
    <a href="dashboard.html" class="btn">Back to Dashboard</a>
  </div>
</div>

<div class="summary-grid">
  <div class="stat-box">
    <div class="stat-val" id="totalCount">0</div>
    <div class="stat-lbl">Total Records</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" style="color:var(--gn)" id="inboundCount">0</div>
    <div class="stat-lbl">Inbound Items</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" style="color:var(--rd)" id="outboundCount">0</div>
    <div class="stat-lbl">Outbound Items</div>
  </div>
</div>

<div class="card">
  <div class="card-title">
    <span>Inventory Ledger Master</span>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="downloadPdf('full')">Download Full PDF</button>
      <button class="btn" style="border-color:var(--gn)" onclick="downloadPdf('inbound')">Inbound PDF</button>
      <button class="btn" style="border-color:var(--rd)" onclick="downloadPdf('outbound')">Outbound PDF</button>
    </div>
  </div>
  
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Type</th>
          <th>Device Name</th>
          <th>Box ID</th>
          <th>Serial Number</th>
          <th>Technician</th>
          <th>Location / Detail</th>
        </tr>
      </thead>
      <tbody id="inventoryTableBody">
        <tr>
          <td colspan="7" style="text-align:center;color:var(--t2);padding:30px;">Connecting to datastream instance...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: batob("QUl6YVN5Q0MxSGRtX0x3SzZid3R5V1Y3Y2tOdm5zX3VUTmppdkU0"),
  authDomain: "cts-field-app.firebaseapp.com",
  projectId: "cts-field-app",
  storageBucket: "cts-field-app.appspot.com",
  messagingSenderId: "128694086604",
  appId: "1:128694086604:web:e2b34762c4784a92c3aee3"
};

function batob(str){ try{ return atob(str); }catch(e){ return str; } }

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

let masterList = [];

function toast(msg, style='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + style;
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => { t.classList.remove('show'); }, 3500);
}

function initStream() {
  db.collection('cts').doc('state').onSnapshot(doc => {
    document.getElementById('loader').style.display = 'none';
    if (!doc.exists) {
      toast('No database schema state found.', 'err');
      return;
    }
    const data = doc.data();
    masterList = data.inventoryLedger || [];
    
    masterList.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
    renderMetricsAndTable();
  }, err => {
    document.getElementById('loader').style.display = 'none';
    toast('Stream disconnect fallback: ' + err.message, 'err');
  });
}

function renderMetricsAndTable() {
  let inCount = 0, outCount = 0;
  const tbody = document.getElementById('inventoryTableBody');
  tbody.innerHTML = '';

  if (masterList.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--t2);padding:30px;">Ledger frame array contains no items.</td></tr>`;
    return;
  }

  masterList.forEach(item => {
    const isOut = item.type === 'outbound' || String(item.status || '').toLowerCase() === 'outbound';
    if (isOut) outCount++; else inCount++;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.timestamp ? new Date(item.timestamp).toLocaleString('en-MY') : 'N/A'}</td>
      <td><span class="badge ${isOut ? 'badge-outbound' : 'badge-inbound'}">${isOut ? 'Outbound' : 'Inbound'}</span></td>
      <td><strong>${escapeHtml(item.deviceName || '')}</strong></td>
      <td>${escapeHtml(item.boxId || '-')}</td>
      <td><code>${escapeHtml(item.serialNumber || '-')}</code></td>
      <td>${escapeHtml(item.operatorName || item.user || 'System')}</td>
      <td>${escapeHtml(item.location || item.remarks || '-')}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('totalCount').textContent = masterList.length;
  document.getElementById('inboundCount').textContent = inCount;
  document.getElementById('outboundCount').textContent = outCount;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function downloadPdf(type) {
  if (masterList.length === 0) {
    toast('No available array logs to print.', 'err');
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  const dateStr = new Date().toLocaleDateString('en-MY');
  const byStr = sessionStorage.getItem('cts_user_name') || 'Authorized Staff';

  function addFooter() {
    const W = doc.internal.pageSize.getWidth();
    const H = doc.internal.pageSize.getHeight();
    const pages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      doc.setFillColor(13, 148, 136);
      doc.rect(0, H - 10, W, 10, 'F');
      doc.setFontSize(7); doc.setTextColor(255, 255, 255);
      doc.text('CTS Production · ' + dateStr + ' · Generated by ' + byStr, 14, H - 4);
      doc.text('Page ' + i + ' of ' + pages, W - 14, H - 4, { align: 'right' });
    }
  }

  let y = 14;

  // ── INBOUND ──
  if (type === 'full' || type === 'inbound') {
    const inboundItems = masterList.filter(item => !(item.type === 'outbound' || String(item.status || '').toLowerCase() === 'outbound'));
    
    if (inboundItems.length > 0) {
      const bodyData = inboundItems.map(item => [
        item.timestamp ? new Date(item.timestamp).toLocaleString('en-MY') : 'N/A',
        item.deviceName || '',
        item.boxId || '-',
        item.serialNumber || '-',
        item.operatorName || item.user || 'System',
        item.location || item.remarks || '-'
      ]);

      doc.autoTable({
        startY: y,
        head: [['Timestamp', 'Device Name', 'Box ID', 'Serial Number', 'Technician', 'Location / Detail']],
        body: bodyData,
        headStyles: { fillColor: [13, 148, 136], halign: 'center' },
        columnStyles: {
          0: { cellWidth: 24, fontSize: 8, halign: 'center' },
          1: { cellWidth: 28, fontStyle: 'bold', overflow: 'linebreak' },
          2: { cellWidth: 16, halign: 'center' },
          3: { cellWidth: 24, halign: 'center' },
          4: { cellWidth: 24, halign: 'center', overflow: 'linebreak' },
          5: { cellWidth: 24, halign: 'center', overflow: 'linebreak' },
          6: { cellWidth: 28, halign: 'center', overflow: 'linebreak' },
        },
        theme: 'grid',
      });
      y = (doc.lastAutoTable && doc.lastAutoTable.finalY) ? doc.lastAutoTable.finalY + 6 : y + 20;
    }
    if (type === 'inbound') {
      addFooter();
      doc.save('CTS_Inbound_' + dateStr.replace(/\//g, '-') + '.pdf');
      toast('✓ Outbound report downloaded', 'ok');
      return;
    }
  }

  // ── OUTBOUND ──
  if (type === 'full' || type === 'outbound') {
    const outboundItems = masterList.filter(item => (item.type === 'outbound' || String(item.status || '').toLowerCase() === 'outbound'));
    
    if (outboundItems.length > 0) {
      const bodyData = outboundItems.map(item => [
        item.timestamp ? new Date(item.timestamp).toLocaleString('en-MY') : 'N/A',
        item.deviceName || '',
        item.boxId || '-',
        item.serialNumber || '-',
        item.operatorName || item.user || 'System',
        item.location || item.remarks || '-'
      ]);

      doc.autoTable({
        startY: y,
        head: [['Timestamp', 'Device Name', 'Box ID', 'Serial Number', 'Technician', 'Location / Detail']],
        body: bodyData,
        headStyles: { fillColor: [239, 68, 68], halign: 'center' },
        columnStyles: {
          0: { cellWidth: 24, fontSize: 8, halign: 'center' },
          1: { cellWidth: 28, fontStyle: 'bold', overflow: 'linebreak' },
          2: { cellWidth: 16, halign: 'center' },
          3: { cellWidth: 24, halign: 'center' },
          4: { cellWidth: 24, halign: 'center', overflow: 'linebreak' },
          5: { cellWidth: 24, halign: 'center', overflow: 'linebreak' },
          6: { cellWidth: 28, halign: 'center', overflow: 'linebreak' },
        },
        theme: 'grid',
      });
      y = (doc.lastAutoTable && doc.lastAutoTable.finalY) ? doc.lastAutoTable.finalY + 6 : y + 20;
    }
    if (type === 'outbound') {
      addFooter();
      doc.save('CTS_Outbound_' + dateStr.replace(/\//g, '-') + '.pdf');
      toast('✓ Outbound report downloaded', 'ok');
      return;
    }
  }

  // ── FULL ──
  if (type === 'full') {
    addFooter();
    doc.save('CTS_Full_Inventory_Report_' + dateStr.replace(/\//g, '-') + '.pdf');
    toast('✓ Full report downloaded', 'ok');
  }
}

function toggleTheme() {
  const isLight = document.body.classList.toggle('light-mode');
  document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
  try { localStorage.setItem('cts_theme', isLight ? 'light' : 'dark'); } catch(e) {}
}

(function initTheme() {
  try {
    const saved = localStorage.getItem('cts_theme');
    if (saved === 'light') {
      document.body.classList.add('light-mode');
      const btn = document.getElementById('themeBtn');
      if (btn) btn.textContent = '☀️';
    }
  } catch(e) {}
})();

window.addEventListener('DOMContentLoaded', initStream);
</script>
</body>
</html>
